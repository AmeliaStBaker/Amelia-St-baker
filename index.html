<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amelia St Baker</title>
<meta name="description" content="Amelia St Baker. Occupational therapist, Co-Founder and keynote speaker, Brisbane. Site coming back shortly.">
<!-- Deliberately NO noindex: last time a noindex tag here told Google to drop the domain.
     Leaving it off means the domain keeps its place in search while the full site is away. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0c0f; --bg-2: #15131a; --ink: #f4f1ea; --muted: #9c96a8;
  --accent: #e8a05c; --line: rgba(244, 241, 234, 0.12);
  --serif: "Fraunces", Georgia, serif; --sans: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans);
  min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem;
  -webkit-font-smoothing: antialiased; position: relative;
}
.mesh {
  position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(60% 50% at 20% 10%, rgba(232, 160, 92, 0.14), transparent 70%),
    radial-gradient(55% 45% at 85% 90%, rgba(201, 123, 143, 0.12), transparent 70%),
    radial-gradient(70% 60% at 50% 50%, var(--bg-2), var(--bg) 80%);
}
.grain {
  position: fixed; inset: -50%; z-index: -1; opacity: 0.04; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
main { max-width: 34rem; text-align: center; }
.name {
  font-family: var(--sans); font-size: 0.85rem; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 1.75rem;
}
h1 {
  font-family: var(--serif); font-weight: 350; letter-spacing: -0.015em;
  font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1.1; margin-bottom: 1.25rem;
}
h1 em { font-style: italic; color: var(--accent); }
p { color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
.links { margin-top: 2.5rem; padding-top: 1.75rem; border-top: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: center; }
.links a { color: var(--muted); text-decoration: none; font-size: 0.95rem; transition: color 0.2s; }
.links a:hover { color: var(--ink); }
.links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<div class="mesh" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<main>
  <p class="name">Amelia St Baker</p>
  <h1>Back <em>shortly.</em></h1>
  <p>Occupational therapist, Co-Founder and keynote speaker, based in Brisbane. The site is being updated. For speaking enquiries in the meantime, email below.</p>
  <div class="links">
    <a href="mailto:admin@ninjaalliedhealth.com?subject=Keynote%20enquiry">admin@ninjaalliedhealth.com</a>
    <a href="https://www.linkedin.com/in/ameliastbaker/">LinkedIn</a>
    <a href="https://www.youtube.com/watch?v=GDZaxNB95lE">TEDx talk</a>
  </div>
</main>
</body>
</html>
